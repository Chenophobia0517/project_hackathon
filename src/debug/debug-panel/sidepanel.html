<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WCC Debug Panel</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <h1>Web Context Capture · Debug</h1>

  <section>
    <h2>Extension 状态</h2>
    <div>Extension: <span id="ext-status">CHECKING...</span></div>
    <div>Content Script: <span id="cs-status">CHECKING...</span></div>
    <div>Background: <span id="bg-status">CHECKING...</span></div>
  </section>

  <section>
    <h2>当前页面信息</h2>
    <div>Title: <span id="page-title">-</span></div>
    <div>URL: <span id="page-url">-</span></div>
    <div>Captured Time: <span id="captured-at">-</span></div>
  </section>

  <section>
    <h2>页面文本统计</h2>
    <div>Total Paragraph Count: <span id="total-count">-</span></div>
    <div>Visible Paragraph Count: <span id="visible-count">-</span></div>
  </section>

  <section>
    <h2>当前阅读内容</h2>
    <div id="reading-list"></div>
  </section>

  <section>
    <h2>数据通信日志</h2>
    <div id="log-list"></div>
  </section>

  <script src="../logger/logger.js"></script>
  <script src="../inspector/inspector.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
